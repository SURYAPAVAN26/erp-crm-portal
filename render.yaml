services:
  # Backend Express API Web Service (Free Tier)
  - type: web
    name: erp-crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: erp-crm-frontend
          property: host

  # Frontend Vite React Static Site (Free)
  - type: web
    name: erp-crm-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: erp-crm-backend
          property: host

databases:
  # Render Managed PostgreSQL Database (Free Tier)
  - name: erp-crm-db
    databaseName: erp_crm
    user: erp_crm_user
    plan: free
