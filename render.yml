services:
  # Backend Express API Web Service
  - type: web
    name: erp-crm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        fromService:
          type: static
          name: erp-crm-frontend
          property: url

  # Frontend Vite React Static Site
  - type: static
    name: erp-crm-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: erp-crm-backend
          property: url

databases:
  # Render Managed PostgreSQL Database
  - name: erp-crm-db
    databaseName: erp_crm
    user: erp_crm_user
    plan: free
